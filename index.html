<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Portal</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Itim&family=Mitr:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Mitr', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #fff0f7, #ffc1dc);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
        }

        .container {
            width: 900px;
            max-width: 90%;
            min-height: 500px;
            display: flex;
            border-radius: 18px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 20px 50px rgba(214, 51, 132, 0.25);
        }

        /* รูปด้านซ้าย */
        .image-section {
            width: 50%;
            background-image: url("https://i.pinimg.com/564x/22/53/9e/22539e9364fcb6b0ba401360a9a3e2f7.jpg");
            background-size: cover;
            background-position: center;
        }

        /* ด้านขวา */
        .info-section {
            width: 50%;
            background: linear-gradient(
                145deg,
                #ff1493,
                #e91e83
            );
            padding: 65px 55px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* ชื่อ */
        .name {
            font-family: 'Itim', cursive;
            font-size: 38px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        /* ตำแหน่ง */
        .role {
            color: #ffd6e8;
            font-family: 'Itim', cursive;
            font-style: italic;
            font-size: 19px;
            margin-bottom: 40px;
        }

        .line {
            width: 100%;
            height: 1px;
            background: rgba(255, 255, 255, 0.35);
            margin-bottom: 30px;
        }

        /* หัวข้อ */
        .label {
            font-family: 'Mitr', sans-serif;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 3px;
            color: #ffd6e8;
            margin-bottom: 10px;
        }

        /* ข้อมูล */
        .value {
            font-family: 'Mitr', sans-serif;
            font-size: 19px;
            font-weight: 400;
            margin-bottom: 25px;
        }

        /* สถานะระบบ */
        .status {
            margin-top: 15px;
            display: flex;
            align-items: center;
            color: #ffeaf4;
            font-family: 'Mitr', sans-serif;
            font-size: 13px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: #ffb6d5;
            border-radius: 50%;
            margin-right: 10px;
            box-shadow: 0 0 12px #fff;
        }

        /* มือถือ */
        @media (max-width: 700px) {
            .container {
                flex-direction: column;
            }

            .image-section,
            .info-section {
                width: 100%;
            }

            .image-section {
                height: 300px;
            }

            .info-section {
                padding: 45px 35px;
            }

            .name {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- รูป -->
        <div class="image-section"></div>

        <!-- ข้อมูล -->
        <div class="info-section">

            <div class="name">
                Kasira Sarimarnond
            </div>

        

            <div class="line"></div>

            <div class="label">
                SERVER DESIGNATION
            </div>

            <div class="value">
                Kasira-1660701234
            </div>

            <div class="label">
                SERVER ID
            </div>

            <div class="value">
                1660701234
            </div>

            <div class="label">
                Kasira Sarimarnond
            </div>

            <div class="value">
                Kasira Sarimarnond
            </div>

            <div class="status">
                <span class="status-dot"></span>
                System Online • Ubuntu 24.04 LTS
            </div>

        </div>

    </div>

</body>
</html>
